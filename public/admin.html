<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generic slides · Admin</title><style>
:root{font:16px system-ui,sans-serif;color:#f4f1e8;background:#181b1d}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:32px 18px 80px}h1{margin:0;font-size:clamp(2rem,5vw,3.4rem)}p{color:#bdc4c3}.toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;background:#181b1df2}.actions{display:flex;gap:10px}button{font:inherit;font-weight:750;border:0;border-radius:9px;padding:11px 17px;background:#edc94e;color:#171717;cursor:pointer}button.secondary{background:#414a4d;color:#fff}.status{min-height:1.4em;color:#ffb7ac}.slides{display:grid;gap:14px}.card{background:#262d2f;border:1px solid #4b575a;border-radius:14px;padding:18px}.card.off{opacity:.6}.row{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.compact{grid-template-columns:1fr 1fr 1fr 1fr}.field{display:block;margin:9px 0;font-weight:650}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;border:1px solid #6c787b;border-radius:7px;background:#101415;color:#fff;padding:9px;font:inherit}.field textarea{resize:vertical;min-height:68px}.checks{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:12px 0}.day{background:#171c1d;border-radius:8px;padding:8px;font-size:.82rem}.day label{display:flex;align-items:center;gap:5px;font-weight:700}.day input[type=time]{width:100%;margin-top:5px;background:#0d1011;color:white;border:1px solid #596366;border-radius:5px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.card-head h2{margin:0;font-size:1.15rem}.delete{background:#713b3b;color:#fff}.preview{container-type:inline-size;aspect-ratio:16/9;background:#777 url('/assets/fallback.webp') center/cover;border-radius:9px;position:relative;overflow:hidden;margin-top:12px}.preview img{position:absolute;inset:0;width:100%;height:100%}.preview .ph,.preview .ps{position:absolute;left:6%;right:6%;text-align:center;color:#111;font-family:TwoPennies,Impact,sans-serif;text-transform:uppercase;white-space:pre-line}.preview .ph{bottom:58.8%;font-size:8.3cqw;line-height:.88}.preview .ps{top:69%;font-size:3.2cqw;line-height:.94}@font-face{font-family:TwoPennies;src:url('/assets/TwoPenniesPlain.ttf')}@media(max-width:800px){.row,.compact{grid-template-columns:1fr}.checks{grid-template-columns:repeat(2,1fr)}}
</style><script nonce="ttp-signage" src="/hub-bridge.js"></script><script nonce="ttp-signage" defer src="/admin.js"></script></head><body><main><h1>Generic slides</h1><p>Edit the standard text slides and decide when each one can appear. A higher chance makes an eligible slide more likely to be chosen when the screen loads.</p><div class="toolbar"><span id="status" class="status"></span><div class="actions"><button id="add" class="secondary">Add slide</button><button id="save">Save changes</button></div></div><section id="slides" class="slides"></section></main></body></html>
