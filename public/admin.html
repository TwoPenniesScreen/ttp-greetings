<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generic slides · Admin</title><style>
@font-face{font-family:TwoPennies;src:url('/assets/TwoPenniesPlain.ttf')} :root{font:15px system-ui,sans-serif;color:#f4f1e8;background:#181b1d}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 22px;border-bottom:1px solid #3d4749;background:#1d2224}.title h1{margin:0;font-size:1.65rem}.title span{color:#aeb8ba}.actions{display:flex;align-items:center;gap:10px}.actions button{border-radius:8px;padding:10px 16px;font-weight:750;background:#edc94e;color:#171717}.actions .secondary{background:#414a4d;color:#fff}.status{min-width:80px;color:#ffb7ac}.workspace{display:grid;grid-template-columns:390px minmax(0,1fr);height:calc(100vh - 82px)}.sidebar{border-right:1px solid #3d4749;background:#141819;overflow-y:auto;padding:10px}.slide-item{display:grid;grid-template-columns:25px 132px minmax(0,1fr);align-items:center;gap:9px;width:100%;padding:9px 8px;border:2px solid transparent;border-radius:9px;background:transparent;color:#fff;text-align:left;margin-bottom:4px}.slide-item:hover{background:#252c2e}.slide-item.selected{border-color:#edc94e;background:#303638}.slide-item.off{opacity:.55}.number{align-self:start;padding-top:3px;color:#929d9f;text-align:center}.slide-meta{min-width:0;display:grid;gap:4px}.slide-meta strong,.slide-meta span,.slide-meta small{overflow:hidden;text-overflow:ellipsis}.slide-meta strong{white-space:nowrap}.slide-meta span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:#c1c9ca;font-size:.79rem;line-height:1.25}.slide-meta small{white-space:nowrap;color:#8f9b9d;font-size:.72rem}.mini-preview,.preview{container-type:inline-size;aspect-ratio:16/9;background:#777 url('/assets/fallback.webp') center/cover;border-radius:5px;position:relative;overflow:hidden}.mini-preview img,.preview img{position:absolute;inset:0;width:100%;height:100%}.mini-head,.mini-sub,.ph,.ps{position:absolute;left:6%;right:6%;text-align:center;color:#111;font-family:TwoPennies,Impact,sans-serif;text-transform:uppercase;white-space:nowrap}.mini-head,.ph{bottom:58.8%;font-size:8.3cqw;line-height:.88}.mini-sub,.ps{top:69%;font-size:3.2cqw;line-height:.94}.editor{overflow-y:auto;padding:24px clamp(18px,4vw,54px) 70px}.editor-head{max-width:920px;margin:0 auto 14px;display:flex;align-items:end;justify-content:space-between;gap:20px}.editor-head h2{margin:2px 0 0;font-size:1.75rem}.eyebrow{color:#9ca7a9;text-transform:uppercase;font-size:.72rem;font-weight:800;letter-spacing:.1em}.delete{background:#713b3b;color:#fff;border-radius:8px;padding:9px 13px;font-weight:700}.preview{max-width:920px;margin:0 auto 20px;border-radius:11px;box-shadow:0 12px 28px #0008}.panel{max-width:920px;margin:14px auto;background:#262d2f;border:1px solid #465154;border-radius:12px;padding:18px}.panel h3{margin:0 0 10px;font-size:1rem;color:#d9dfdf}.row{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.compact{grid-template-columns:repeat(4,1fr)}.field{display:block;margin:6px 0;font-weight:650}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;border:1px solid #687477;border-radius:7px;background:#101415;color:#fff;padding:9px}.field textarea{resize:vertical;min-height:68px}.toggle{display:flex;align-items:center;gap:7px;margin-top:14px}.toggle input{width:auto;margin:0}.help{margin:0 0 12px;color:#aeb8ba;line-height:1.45}.empty-events{padding:12px;border:1px dashed #596366;border-radius:8px}.event-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.event-choice{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#171c1d;border:1px solid #465154;border-radius:8px;cursor:pointer}.event-choice:has(input:checked){border-color:#edc94e;background:#303638}.event-choice input{width:18px;height:18px;accent-color:#edc94e}.event-choice span{display:grid;gap:2px}.event-choice small{color:#aeb8ba}.checks{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center;background:#171c1d;border-radius:8px;padding:8px;font-size:.8rem}.day label{grid-column:1/-1;display:flex;align-items:center;gap:5px;font-weight:750}.day input[type=time]{grid-column:1/-1;width:100%;background:#0d1011;color:#fff;border:1px solid #596366;border-radius:5px;padding:4px}.day span{display:none}.empty{display:grid;place-items:center;height:100%;color:#aeb8ba}@media(max-width:1050px){.workspace{grid-template-columns:320px minmax(0,1fr)}.slide-item{grid-template-columns:22px 100px minmax(0,1fr)}.compact{grid-template-columns:1fr 1fr}.checks{grid-template-columns:repeat(4,1fr)}}@media(max-width:720px){.event-checks{grid-template-columns:1fr}body{overflow:auto}.topbar{height:auto;position:sticky;top:0;z-index:5}.workspace{display:block;height:auto}.sidebar{height:310px;border-right:0;border-bottom:1px solid #3d4749}.slide-item{grid-template-columns:22px 118px minmax(0,1fr)}.editor{overflow:visible;padding:18px 12px 60px}.row,.compact{grid-template-columns:1fr}.checks{grid-template-columns:1fr 1fr}.title span{display:none}}
</style><script nonce="ttp-signage" src="/hub-bridge.js"></script><script nonce="ttp-signage" defer src="/admin.js"></script></head><body><header class="topbar"><div class="title"><h1>Generic slides</h1><span id="count">Loading slides…</span></div><div class="actions"><span id="status" class="status"></span><button id="add" class="secondary">Add slide</button><button id="save">Save changes</button></div></header><main class="workspace"><aside id="slides" class="sidebar" aria-label="Slides"></aside><section id="editor" class="editor"></section></main></body></html>
