[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'nonce-ttp-signage'; style-src 'self' 'unsafe-inline'; img-src 'self' https://ttp-brand.netlify.app data:; connect-src 'self' https://ttp-brand.netlify.app; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
